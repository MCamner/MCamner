name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
    - name: Lint with flake8
      run: |
        flake8 helper/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 helper/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Test v2 evaluator, profiles, and report contracts
      run: node --test tests/test_readiness_v2.js
    - name: Test with pytest
      run: |
        pytest tests/
