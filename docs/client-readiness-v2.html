<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Readiness Diagnostics v2 | Multi-Profile Endpoint Validation</title>
  <meta name="description" content="Multi-profile endpoint readiness diagnostics with live, saved, and sample data fallback for client validation and operations review.">
  <meta name="author" content="Mattias Camner">
  <link rel="canonical" href="https://mcamner.github.io/MCamner/client-readiness-v2.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Client Readiness Diagnostics v2">
  <meta property="og:description" content="Multi-profile endpoint readiness diagnostics with live, saved, and sample data fallback.">
  <meta property="og:url" content="https://mcamner.github.io/MCamner/client-readiness-v2.html">
  <meta property="og:image" content="https://mcamner.github.io/MCamner/mqlaunch-demo.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1, h2 { margin-top: 1.5rem; }
    .toolbar, .summary {
      display: grid;
      gap: 1rem;
      margin: 1rem 0 1.5rem;
    }
    .toolbar {
      grid-template-columns: 1fr;
    }
    .summary {
      grid-template-columns: repeat(4, minmax(120px, 1fr));
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem;
      background: #fafafa;
    }
    .meta {
      margin: 1rem 0 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #f8f8f8;
    }
    .meta div {
      margin: 0.25rem 0;
    }
    .meta strong {
      display: inline-block;
      min-width: 140px;
    }
    .warning {
      margin: 0 0 1rem;
      padding: 0.9rem 1rem;
      border: 1px solid #f5c26b;
      border-radius: 10px;
      background: #fff7e6;
      color: #8a5a00;
      display: none;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 0.5rem;
    }
    select {
      padding: 0.5rem;
      font-size: 1rem;
      min-width: 280px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 0.75rem;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f5f5f5; }
    .PASS { color: #0a7a2f; font-weight: bold; }
    .FAIL { color: #b42318; font-weight: bold; }
    .WARN { color: #b26a00; font-weight: bold; }
    td.value-cell {
      max-width: 260px;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 12em;
      overflow: auto;
    }
  </style>
</head>
<body>
  <p style="margin:0 0 1rem"><a href="client-readiness-check.html">← Client Readiness Check (v1)</a></p>
  <h1>Client Readiness v2</h1>
  <p>Multi-profile readiness evaluation with live → saved → sample fallback</p>

  <div class="toolbar">
    <div class="card">
      <label for="profile-select">Baseline profile</label>
      <select id="profile-select"></select>
    </div>
  </div>

  <div id="profile-warning" class="warning"></div>
  <div id="meta" class="meta"></div>
  <div id="summary" class="summary"></div>

  <h2>Processes</h2>
  <div id="processes" class="meta"></div>

  <h2>Smartcard</h2>
  <div id="smartcard" class="meta"></div>

  <h2>Results</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Status</th>
        <th>Severity</th>
        <th>Expected</th>
        <th>Actual</th>
        <th>Evidence</th>
        <th>Remediation</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>

  <script src="evaluator.js"></script>
  <script>
    const PROFILE_INDEX_URL = "profiles/index.json";

    const DATA_SOURCES = [
      {
        key: "live-helper",
        url: "http://127.0.0.1:38765/status",
        timeoutMs: 2500,
        cache: "no-store"
      },
      {
        key: "saved-live",
        url: "live-client-data.json",
        timeoutMs: 1500,
        cache: "no-store"
      },
      {
        key: "sample-data",
        url: "sample-client-data.json",
        timeoutMs: 1500,
        cache: "default"
      }
    ];

    async function loadJson(url, options = {}) {
      const controller = new AbortController();
      const timeoutMs = options.timeoutMs || 2000;
      const timeout = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, {
          cache: options.cache || "default",
          signal: controller.signal
        });

        clearTimeout(timeout);

        if (!res.ok) {
          throw new Error(`Failed to load ${url} (${res.status})`);
        }

        return await res.json();
      } catch (err) {
        clearTimeout(timeout);
        throw err;
      }
    }

    async function loadClientData() {
      const errors = [];

      for (const source of DATA_SOURCES) {
        try {
          const data = await loadJson(source.url, {
            timeoutMs: source.timeoutMs,
            cache: source.cache
          });

          return {
            source: source.key,
            url: source.url,
            data
          };
        } catch (err) {
          errors.push(`${source.key}: ${err.message}`);
        }
      }

      throw new Error("All data sources failed: " + errors.join(" | "));
    }

    function clearElement(element) {
      while (element.firstChild) {
        element.removeChild(element.firstChild);
      }
    }

    function appendTextRow(root, label, value) {
      const row = document.createElement("div");
      const strong = document.createElement("strong");
      strong.textContent = label + ":";
      row.appendChild(strong);
      row.appendChild(document.createTextNode(" " + String(value ?? "")));
      root.appendChild(row);
    }

    function appendEmptyMessage(root, message) {
      clearElement(root);
      const row = document.createElement("div");
      const emphasis = document.createElement("em");
      emphasis.textContent = message;
      row.appendChild(emphasis);
      root.appendChild(row);
    }

    function createBadge(text, color, bold = false) {
      const badge = document.createElement("span");
      badge.style.color = color;
      badge.style.marginRight = "1rem";
      if (bold) {
        badge.style.fontWeight = "bold";
      }
      badge.textContent = text;
      return badge;
    }

    function appendList(root, items) {
      const list = document.createElement("ul");
      list.style.margin = "4px 0 0 1.2em";
      list.style.padding = "0";

      if (items?.length) {
        items.forEach((item) => {
          const li = document.createElement("li");
          li.textContent = item;
          list.appendChild(li);
        });
      } else {
        const li = document.createElement("li");
        const emphasis = document.createElement("em");
        emphasis.textContent = "None detected";
        li.appendChild(emphasis);
        list.appendChild(li);
      }

      root.appendChild(list);
    }

    function appendPreRow(root, label, value) {
      if (!value) {
        return;
      }

      const row = document.createElement("div");
      const strong = document.createElement("strong");
      const pre = document.createElement("pre");
      strong.textContent = label + ":";
      pre.style.fontSize = "0.85em";
      pre.style.marginTop = "4px";
      pre.textContent = value;
      row.appendChild(strong);
      row.appendChild(pre);
      root.appendChild(row);
    }

    function renderMeta(payload, profile) {
      const root = document.getElementById("meta");
      const helperMeta = payload.data && payload.data.meta ? payload.data.meta : {};
      clearElement(root);
      appendTextRow(root, "Selected profile", profile.label || profile.profile || "unknown");
      appendTextRow(root, "Helper profile", helperMeta.profile || "n/a");
      appendTextRow(root, "Data source", payload.source);
      appendTextRow(root, "Location", payload.url);
      appendTextRow(root, "Platform", helperMeta.platform || "unknown");
      appendTextRow(root, "Release", helperMeta.platform_release || "unknown");
      appendTextRow(root, "Agent version", helperMeta.agent_version || "n/a");
      appendTextRow(root, "Hostname", helperMeta.hostname || payload.data?.network?.hostname || "unknown");
    }

    function renderProcesses(data) {
      const root = document.getElementById("processes");
      const proc = data?.processes;

      if (!proc) {
        appendEmptyMessage(root, "No process data available.");
        return;
      }

      clearElement(root);

      const runningRow = document.createElement("div");
      const runningLabel = document.createElement("strong");
      runningLabel.textContent = "Running:";
      runningRow.appendChild(runningLabel);
      runningRow.appendChild(document.createTextNode(" "));
      if (proc.running?.length) {
        proc.running.forEach((processName) => {
          runningRow.appendChild(createBadge(processName, "#0a7a2f", true));
        });
      } else {
        const emphasis = document.createElement("em");
        emphasis.textContent = "None";
        runningRow.appendChild(emphasis);
      }
      root.appendChild(runningRow);

      const missingRow = document.createElement("div");
      const missingLabel = document.createElement("strong");
      missingRow.style.marginTop = "0.5rem";
      missingLabel.textContent = "Not detected:";
      missingRow.appendChild(missingLabel);
      missingRow.appendChild(document.createTextNode(" "));
      if (proc.missing?.length) {
        proc.missing.forEach((processName) => {
          missingRow.appendChild(createBadge(processName, "#888"));
        });
      } else {
        const emphasis = document.createElement("em");
        emphasis.textContent = "None";
        missingRow.appendChild(emphasis);
      }
      root.appendChild(missingRow);
    }

    function renderSmartcard(data) {
      const root = document.getElementById("smartcard");
      const sc = data?.smartcard;

      if (!sc) {
        appendEmptyMessage(root, "No smartcard data available.");
        return;
      }

      const statusColor = sc.pcscd_running === true ? "#0a7a2f" : sc.pcscd_running === false ? "#b42318" : "#8a5a00";
      const statusText = sc.pcscd_running === true ? "Running" : sc.pcscd_running === false ? "Not running" : "Unknown";
      clearElement(root);

      const statusRow = document.createElement("div");
      const statusLabel = document.createElement("strong");
      const status = document.createElement("span");
      statusLabel.textContent = "pcscd:";
      status.style.color = statusColor;
      status.style.fontWeight = "bold";
      status.textContent = statusText;
      statusRow.appendChild(statusLabel);
      statusRow.appendChild(document.createTextNode(" "));
      statusRow.appendChild(status);
      root.appendChild(statusRow);

      [
        ["Readers (pcsc_scan)", sc.readers],
        ["Readers (opensc-tool)", sc.opensc_readers],
        ["USB devices", sc.usb_devices]
      ].forEach(([label, items]) => {
        const row = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = label + ":";
        row.appendChild(strong);
        appendList(row, items);
        root.appendChild(row);
      });

      appendPreRow(root, "system_profiler", sc.system_profiler);
      appendPreRow(root, "sc_auth list", sc.sc_auth_list);
    }

    function renderWarning(selectedProfileId, helperProfileId) {
      const root = document.getElementById("profile-warning");

      if (!helperProfileId || helperProfileId === selectedProfileId) {
        root.style.display = "none";
        root.textContent = "";
        return;
      }

      root.style.display = "block";
      root.textContent = `Profile mismatch: selected "${selectedProfileId}" but helper reports "${helperProfileId}". Results may be misleading.`;
    }

    function renderSummary(summary) {
      const root = document.getElementById("summary");
      clearElement(root);

      [
        ["Total", summary.total],
        ["Passed", summary.passed],
        ["Failed", summary.failed],
        ["Warnings", summary.warnings ?? 0],
        ["Unsupported", summary.unsupported ?? 0]
      ].forEach(([label, value]) => {
        const card = document.createElement("div");
        const strong = document.createElement("strong");
        card.className = "card";
        strong.textContent = label;
        card.appendChild(strong);
        card.appendChild(document.createElement("br"));
        card.appendChild(document.createTextNode(String(value)));
        root.appendChild(card);
      });
    }

    function formatValueForDisplay(value, limit) {
      const max = limit || 15;
      if (Array.isArray(value) && value.length > max) {
        const shown = value.slice(0, max);
        return (
          JSON.stringify(shown, null, 2) +
          `\n… and ${value.length - max} more (see full JSON export for the rest)`
        );
      }
      return JSON.stringify(value, null, 2);
    }

    function renderResults(results) {
      const body = document.getElementById("results-body");
      clearElement(body);

      results.forEach((result) => {
        const row = document.createElement("tr");
        const fields = [
          result.id,
          result.title,
          result.status,
          result.severity,
          formatValueForDisplay(result.expected),
          formatValueForDisplay(result.actual),
          result.evidence,
          result.remediation || ""
        ];

        fields.forEach((field, index) => {
          const cell = document.createElement("td");
          if (index === 2) {
            cell.className = result.status;
          }
          if (index === 4 || index === 5) {
            cell.classList.add("value-cell");
            const pre = document.createElement("pre");
            pre.textContent = field;
            cell.appendChild(pre);
          } else {
            cell.textContent = field;
          }
          row.appendChild(cell);
        });

        body.appendChild(row);
      });
    }

    function getRequestedProfileId(profileIndex, helperProfileId) {
      const params = new URLSearchParams(window.location.search);
      const requested = params.get("profile");
      const validIds = new Set(profileIndex.profiles.map(p => p.id));

      if (requested && validIds.has(requested)) {
        return requested;
      }

      if (helperProfileId && validIds.has(helperProfileId)) {
        return helperProfileId;
      }

      return profileIndex.default_profile;
    }

    function updateUrlProfile(profileId) {
      const url = new URL(window.location.href);
      url.searchParams.set("profile", profileId);
      window.history.replaceState({}, "", url);
    }

    function populateProfileSelect(profileIndex, selectedId) {
      const select = document.getElementById("profile-select");
      clearElement(select);
      profileIndex.profiles.forEach((profile) => {
        const option = document.createElement("option");
        option.value = profile.id;
        option.selected = profile.id === selectedId;
        option.textContent = profile.label;
        select.appendChild(option);
      });
      return select;
    }

    async function evaluateSelectedProfile(profileIndex, selectedId, clientPayload) {
      const profileMeta = profileIndex.profiles.find(p => p.id === selectedId);
      const profile = await loadJson(profileMeta.path, { timeoutMs: 2000, cache: "no-store" });

      const helperProfileId = clientPayload?.data?.meta?.profile || null;

      renderMeta(clientPayload, profile);
      renderWarning(selectedId, helperProfileId);
      renderProcesses(clientPayload.data);
      renderSmartcard(clientPayload.data);

      const output = window.ClientReadinessEvaluator.evaluateProfile(profile, clientPayload.data);
      renderSummary(output.summary);
      renderResults(output.results);
    }

    async function main() {
      try {
        const [profileIndex, clientPayload] = await Promise.all([
          loadJson(PROFILE_INDEX_URL, { timeoutMs: 2000, cache: "no-store" }),
          loadClientData()
        ]);

        const helperProfileId = clientPayload?.data?.meta?.profile || null;
        const selectedId = getRequestedProfileId(profileIndex, helperProfileId);

        updateUrlProfile(selectedId);

        const select = populateProfileSelect(profileIndex, selectedId);

        await evaluateSelectedProfile(profileIndex, selectedId, clientPayload);

        select.addEventListener("change", async (event) => {
          const newProfileId = event.target.value;
          updateUrlProfile(newProfileId);
          await evaluateSelectedProfile(profileIndex, newProfileId, clientPayload);
        });
      } catch (err) {
        const error = document.createElement("p");
        const strong = document.createElement("strong");
        error.style.color = "red";
        strong.textContent = "Error:";
        error.appendChild(strong);
        error.appendChild(document.createTextNode(" " + err.message));
        document.body.appendChild(error);
      }
    }

    main();
  </script>
</body>
</html>
